{% extends 'base.html' %}
{% block title %}Company Profile & Settings{% endblock %}
{% block content %}
<div class="bg-navy text-white py-4 mb-4">
    <div class="container">
        <h2 class="fw-bold mb-1">Company Profile</h2>
        <p class="text-light opacity-80 mb-0">Manage public enterprise branding, location, industry, and contact coordinates.</p>
    </div>
</div>

<div class="container pb-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card p-4 p-md-5 border-0 shadow-sm rounded-4">
                <form method="POST" action="{{ url_for('employer.profile') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <h5 class="fw-bold text-navy mb-3"><i class="bi bi-building text-teal me-2"></i>Corporate Identity</h5>
                    <div class="row g-3 mb-4">
                        <div class="col-md-8">
                            <label class="form-label small text-secondary fw-semibold">Company Name <span class="text-danger">*</span></label>
                            <input type="text" name="company_name" class="form-control" value="{{ employer.company_name }}" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small text-secondary fw-semibold">Company Size</label>
                            <select name="company_size" class="form-select">
                                <option value="1-10" {% if employer.company_size == '1-10' %}selected{% endif %}>1-10 employees</option>
                                <option value="11-50" {% if employer.company_size == '11-50' %}selected{% endif %}>11-50 employees</option>
                                <option value="51-200" {% if employer.company_size == '51-200' %}selected{% endif %}>51-200 employees</option>
                                <option value="201-500" {% if employer.company_size == '201-500' %}selected{% endif %}>201-500 employees</option>
                                <option value="500+" {% if employer.company_size == '500+' %}selected{% endif %}>500+ employees</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label small text-secondary fw-semibold">About Organization</label>
                            <textarea name="description" class="form-control" rows="4" placeholder="Brief overview of company vision, domain, and culture...">{{ employer.description or '' }}</textarea>
                        </div>
                    </div>

                    <h5 class="fw-bold text-navy mb-3 border-top pt-4"><i class="bi bi-geo-alt text-teal me-2"></i>Operations & Industry</h5>
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label small text-secondary fw-semibold">Industry Vertical</label>
                            <input type="text" name="industry" class="form-control" value="{{ employer.industry or '' }}" placeholder="Information Technology, FinTech, Healthcare">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small text-secondary fw-semibold">Headquarters Location</label>
                            <input type="text" name="location" class="form-control" value="{{ employer.location or '' }}" placeholder="Bengaluru, Karnataka">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small text-secondary fw-semibold">Official Website</label>
                            <input type="url" name="website" class="form-control" value="{{ employer.website or '' }}" placeholder="https://company.com">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small text-secondary fw-semibold">Business Email</label>
                            <input type="email" name="business_email" class="form-control" value="{{ employer.business_email or '' }}" placeholder="careers@company.com">
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-3 pt-3 border-top">
                        <a href="{{ url_for('employer.dashboard') }}" class="btn btn-outline-secondary px-4">Cancel</a>
                        <button type="submit" class="btn btn-primary px-4"><i class="bi bi-check2-circle me-1"></i> Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
