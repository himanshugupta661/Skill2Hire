{% extends 'base.html' %}
{% block title %}Page Not Found (404){% endblock %}
{% block content %}
<div class="container py-5 text-center my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="p-5 bg-white rounded-4 shadow-sm border border-secondary-subtle">
                <i class="bi bi-compass text-teal display-1 mb-3"></i>
                <h2 class="fw-bold text-navy">Page Not Found</h2>
                <p class="text-muted mb-4">The page or resource you are looking for doesn't exist, has been moved, or is temporarily unavailable.</p>
                <div class="d-flex justify-content-center gap-3">
                    <a href="{{ url_for('public.index') }}" class="btn btn-primary px-4">Return Home</a>
                    <a href="{{ url_for('public.jobs') }}" class="btn btn-outline-primary px-4">Browse Jobs</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
