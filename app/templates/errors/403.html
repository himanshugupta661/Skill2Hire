{% extends 'base.html' %}
{% block title %}Access Denied (403){% endblock %}
{% block content %}
<div class="container py-5 text-center my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="p-5 bg-white rounded-4 shadow-sm border border-danger-subtle">
                <i class="bi bi-shield-lock text-danger display-1 mb-3"></i>
                <h2 class="fw-bold text-navy">Access Forbidden</h2>
                <p class="text-muted mb-4">You do not have permission to view or perform this action on SKILL2HIRE.</p>
                <div class="d-flex justify-content-center gap-3">
                    <a href="{{ url_for('public.index') }}" class="btn btn-primary px-4">Return Home</a>
                    <a href="{{ url_for('auth.login') }}" class="btn btn-outline-secondary px-4">Sign In</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
