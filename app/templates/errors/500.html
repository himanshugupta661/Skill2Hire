{% extends 'base.html' %}
{% block title %}Server Error (500){% endblock %}
{% block content %}
<div class="container py-5 text-center my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="p-5 bg-white rounded-4 shadow-sm border border-danger-subtle">
                <i class="bi bi-exclamation-triangle-fill text-danger display-1 mb-3"></i>
                <h2 class="fw-bold text-navy">Internal Server Error</h2>
                <p class="text-muted mb-4">Something went wrong on our end while processing your request. Our automated diagnostics have logged this event.</p>
                <div class="d-flex justify-content-center gap-3">
                    <a href="{{ url_for('public.index') }}" class="btn btn-primary px-4">Back to Safety</a>
                    <a href="{{ url_for('public.contact') }}" class="btn btn-outline-secondary px-4">Report Issue</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
